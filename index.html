<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CA Final Audit - Interactive MCQ Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #1b0a3f 0%, #080214 100%);
      color: #ffffff;
      min-height: 100vh;
    }
    
    .kbc-hexagon {
      clip-path: polygon(3% 0%, 97% 0%, 100% 50%, 97% 100%, 3% 100%, 0% 50%);
      transition: all 0.3s ease;
    }
    
    .option-btn {
      background: linear-gradient(180deg, #182260 0%, #0b0f33 100%);
      border: 2px solid #3b82f6;
    }
    
    .option-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-color: #f59e0b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      transform: scale(1.02);
    }
    
    .option-selected {
      background: linear-gradient(180deg, #d97706 0%, #b45309 100%) !important;
      border-color: #fef08a !important;
      animation: pulse 0.8s infinite alternate;
    }
    
    .option-correct {
      background: linear-gradient(180deg, #15803d 0%, #166534 100%) !important;
      border-color: #4ade80 !important;
      box-shadow: 0 0 20px #22c55e;
    }
    
    .option-wrong {
      background: linear-gradient(180deg, #b91c1c 0%, #991b1b 100%) !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 20px #ef4444;
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glow-gold {
      text-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b;
    }

    /* Social Branding Icons Styling */
    .sf-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.3s ease;
      background: rgba(0, 0, 0, 0.5);
    }
    .sf-icon.ig { border: 1px solid #e1306c; color: #e1306c; }
    .sf-icon.ig:hover { background: #e1306c; color: #fff; box-shadow: 0 0 15px #e1306c; }
    
    .sf-icon.li { border: 1px solid #0077b5; color: #0077b5; }
    .sf-icon.li:hover { background: #0077b5; color: #fff; box-shadow: 0 0 15px #0077b5; }
    
    .sf-icon.yt { border: 1px solid #ff0000; color: #ff0000; }
    .sf-icon.yt:hover { background: #ff0000; color: #fff; box-shadow: 0 0 15px #ff0000; }
    
    .sf-icon.tg { border: 1px solid #0088cc; color: #0088cc; }
    .sf-icon.tg:hover { background: #0088cc; color: #fff; box-shadow: 0 0 15px #0088cc; }

    #question-text {
      line-height: 1.8;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen p-2 md:p-6 overflow-x-hidden">

  <!-- Top Navigation & Lifelines -->
  <header class="flex flex-wrap justify-between items-center gap-4 glass-panel p-4 rounded-2xl border-yellow-500/30 max-w-5xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-yellow-500/20 border-2 border-yellow-500 flex items-center justify-center text-yellow-400 text-xl font-bold glow-gold">
        <i class="fa-solid font-black">CA</i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-yellow-400 leading-tight">CA FINAL AUDIT</h1>
        <p class="text-xs text-gray-400">Advanced Auditing MCQs</p>
      </div>
    </div>

    <!-- Right Controls: Lifelines & Reset -->
    <div class="flex items-center gap-3">
      <button onclick="retakeQuiz()" class="px-3 py-2 rounded-lg bg-red-900/50 border border-red-500 text-xs font-bold text-red-200 hover:bg-red-600 transition flex items-center gap-2 mr-2">
        <i class="fa-solid fa-rotate-right"></i> Retake
      </button>

      <button id="life-5050" onclick="use5050()" class="w-12 h-12 rounded-full bg-blue-900/80 border-2 border-cyan-400 flex flex-col items-center justify-center text-xs font-bold hover:bg-cyan-500 hover:text-black transition shadow-lg shadow-cyan-500/20">
        <span>50:50</span>
      </button>
      <button id="life-poll" onclick="useAudiencePoll()" class="w-12 h-12 rounded-full bg-blue-900/80 border-2 border-cyan-400 flex items-center justify-center text-sm font-bold hover:bg-cyan-500 hover:text-black transition shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-chart-bar"></i>
      </button>
      <button id="life-expert" onclick="useExpertAdvice()" class="w-12 h-12 rounded-full bg-blue-900/80 border-2 border-cyan-400 flex items-center justify-center text-sm font-bold hover:bg-cyan-500 hover:text-black transition shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-user-tie"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Dashboard -->
  <main id="quiz-container" class="flex-grow flex flex-col justify-center max-w-5xl mx-auto w-full my-8 space-y-8">
    
    <!-- Question Container -->
    <div class="relative w-full">
      <div class="kbc-hexagon bg-gradient-to-r from-blue-950 via-indigo-900 to-blue-950 border-2 border-yellow-500/80 p-8 md:p-10 min-h-[160px] flex items-center shadow-2xl">
        <p id="question-text" class="text-sm md:text-[17px] font-medium text-gray-100 whitespace-pre-wrap text-justify w-full">
          Fetching questions from repository...
        </p>
      </div>
    </div>

    <!-- Options Grid -->
    <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
      <!-- Dynamic Option Buttons inserted via JS -->
    </div>

  </main>

  <!-- Bottom Section: Navigation & Branding -->
  <footer id="quiz-footer" class="max-w-5xl mx-auto w-full space-y-6 mt-4">
    
    <!-- Navigation Bar -->
    <div class="flex justify-between items-center glass-panel p-4 rounded-2xl">
      <button onclick="prevQuestion()" class="px-6 py-2.5 rounded-lg bg-gray-800 border border-gray-600 hover:bg-gray-700 text-sm font-semibold text-gray-300 transition flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Previous
      </button>
      <div class="text-sm text-yellow-400/80 font-mono tracking-widest font-bold" id="score-counter">
        QUESTION -- / --
      </div>
      <button id="next-btn" onclick="nextQuestion()" class="px-8 py-2.5 rounded-lg bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-black text-sm font-bold transition shadow-lg shadow-yellow-500/20 flex items-center gap-2">
        Next <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- Interactive Social Branding -->
    <section class="flex flex-col items-center justify-center py-4">
      <div class="section-footer flex gap-6">
           <a href="https://www.instagram.com/" target="_blank" class="sf-icon ig" title="Instagram"><i class="fab fa-instagram"></i></a>
           <a href="https://www.linkedin.com/in/satyam-kumar5286o" target="_blank" class="sf-icon li" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
           <a href="https://youtube.com/@observe_with_satyam" target="_blank" class="sf-icon yt" title="YouTube"><i class="fab fa-youtube"></i></a>
           <a href="https://t.me/CA_Protracker" target="_blank" class="sf-icon tg" title="Telegram"><i class="fab fa-telegram-plane"></i></a>
      </div>
    </section>
  </footer>

  <!-- End Screen / Call to Action (Hidden by default) -->
  <div id="end-screen" class="hidden flex-grow flex-col items-center justify-center max-w-4xl mx-auto w-full text-center space-y-8 my-10">
    <div class="text-yellow-400 text-6xl glow-gold mb-4"><i class="fa-solid fa-trophy"></i></div>
    <h1 class="text-4xl font-bold text-white tracking-wide">Quiz Completed!</h1>
    <p class="text-lg text-gray-300">You have successfully attempted all the questions.</p>
    
    <div class="bg-gradient-to-b from-blue-900/50 to-black/50 border border-yellow-500/50 rounded-2xl p-8 mt-6 shadow-2xl">
      <h3 class="text-2xl font-bold text-yellow-400 mb-2">Developed with ❤️ by Satyam</h3>
      <p class="text-gray-300 mb-6">Master CA Final Concepts seamlessly. Support the effort by subscribing!</p>
      
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="https://youtube.com/@observe_with_satyam" target="_blank" class="px-8 py-3 rounded-full bg-red-600 hover:bg-red-700 text-white font-bold text-lg transition flex items-center justify-center gap-3 shadow-lg shadow-red-600/30">
          <i class="fab fa-youtube text-2xl"></i> Subscribe on YouTube
        </a>
        <button onclick="retakeQuiz()" class="px-8 py-3 rounded-full bg-gray-700 hover:bg-gray-600 border border-gray-500 text-white font-bold text-lg transition flex items-center justify-center gap-3">
          <i class="fa-solid fa-rotate-right"></i> Retake Quiz
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Simple Correct/Incorrect Popup -->
  <div id="explanation-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gradient-to-b from-slate-900 to-blue-950 border-2 border-yellow-500 rounded-2xl max-w-lg w-full p-8 shadow-2xl text-center space-y-6">
      
      <h2 id="modal-title" class="text-3xl font-bold text-yellow-400 flex items-center justify-center gap-3">
        <!-- Status Title dynamically injected -->
      </h2>
      
      <div id="modal-subtitle" class="text-base text-gray-200 leading-relaxed font-medium">
        <!-- Subtitle dynamically injected -->
      </div>

      <div class="pt-4">
        <button onclick="closeModal()" class="px-10 py-3 bg-yellow-500 text-black rounded-full font-bold text-lg hover:bg-yellow-400 transition shadow-lg shadow-yellow-500/20 w-full">
          Continue
        </button>
      </div>
    </div>
  </div>

  <!-- Audio Synthesis Engine for Sound Effects -->
  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundCorrect() {
      playBeep(523.25, 'triangle', 0.2);
      setTimeout(() => playBeep(659.25, 'triangle', 0.2), 150);
      setTimeout(() => playBeep(783.99, 'triangle', 0.4), 300);
    }

    function soundWrong() {
      playBeep(220, 'sawtooth', 0.3);
      setTimeout(() => playBeep(180, 'sawtooth', 0.5), 250);
    }
  </script>

  <!-- Dynamic Fetch & Quiz Logic Script -->
  <script>
    const JSON_DATA_URL = './mcqs.json'; 

    let questionsData = [];
    
    // Retrieve saved progress from localStorage (fallback feature)
    let currentIdx = parseInt(localStorage.getItem('caAuditAppProgress')) || 0;
    
    let selectedOption = null;
    let isAnswered = false;

    // Fetch JSON File
    async function fetchQuestions() {
      try {
        const response = await fetch(JSON_DATA_URL);
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        questionsData = await response.json();
        if (questionsData.length > 0) {
          // Check if saved index is out of bounds
          if (currentIdx >= questionsData.length) currentIdx = 0;
          initGame();
        } else {
          document.getElementById('question-text').innerText = "No questions found in mcqs.json!";
        }
      } catch (error) {
        console.error("Failed to load mcqs.json:", error);
        document.getElementById('question-text').innerText = "Error loading mcqs.json. Make sure the file exists in the same repository!";
      }
    }

    function initGame() {
      document.getElementById('end-screen').classList.add('hidden');
      document.getElementById('quiz-container').classList.remove('hidden');
      document.getElementById('quiz-footer').classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      isAnswered = false;
      selectedOption = null;

      // Save progress to localStorage
      localStorage.setItem('caAuditAppProgress', currentIdx);

      const q = questionsData[currentIdx];
      document.getElementById('question-text').innerHTML = `<span class="text-yellow-400 font-bold tracking-wider">Q${q.id}.</span> ${q.question}`;
      document.getElementById('score-counter').innerText = `QUESTION ${currentIdx + 1} / ${questionsData.length}`;

      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.id = `opt-${idx}`;
        btn.onclick = () => selectOption(idx);
        btn.className = "option-btn kbc-hexagon text-left p-5 md:p-6 text-sm md:text-base font-medium rounded-xl transition duration-200 flex items-center gap-3";
        btn.innerHTML = `<span class="text-yellow-400 font-bold min-w-[24px]"></span> <span class="leading-relaxed">${opt}</span>`;
        grid.appendChild(btn);
      });
    }

    function selectOption(idx) {
      if (isAnswered) return;
      playBeep(300, 'sine', 0.1);

      const buttons = document.getElementById('options-grid').children;
      for (let btn of buttons) btn.classList.remove('option-selected');

      selectedOption = idx;
      document.getElementById(`opt-${idx}`).classList.add('option-selected');

      setTimeout(() => lockAnswer(idx), 800);
    }

    function lockAnswer(idx) {
      if (isAnswered) return;
      isAnswered = true;

      const q = questionsData[currentIdx];
      const selectedBtn = document.getElementById(`opt-${idx}`);
      const correctBtn = document.getElementById(`opt-${q.correctOption}`);

      selectedBtn.classList.remove('option-selected');

      if (idx === q.correctOption) {
        selectedBtn.classList.add('option-correct');
        soundCorrect();
        setTimeout(() => showExplanation(true), 1200);
      } else {
        selectedBtn.classList.add('option-wrong');
        if (correctBtn) correctBtn.classList.add('option-correct');
        soundWrong();
        setTimeout(() => showExplanation(false), 1200);
      }
    }

    function showExplanation(isCorrect) {
      const q = questionsData[currentIdx];
      const modal = document.getElementById('explanation-modal');
      const title = document.getElementById('modal-title');
      const subtitle = document.getElementById('modal-subtitle');

      if (isCorrect) {
        title.innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> Awesome!`;
        subtitle.innerHTML = `You selected the <span class="text-green-400 font-bold">Right Answer</span>.`;
      } else {
        title.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500"></i> Incorrect!`;
        // Show what the correct option was, since we removed the long explanation block
        subtitle.innerHTML = `The correct answer was highlighted in green:<br><br><div class="text-yellow-400 text-sm md:text-base text-left bg-black/30 p-4 rounded-xl border border-yellow-500/30">${q.options[q.correctOption]}</div>`;
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('explanation-modal').classList.add('hidden');
    }

    function nextQuestion() {
      closeModal();
      if (currentIdx < questionsData.length - 1) {
        currentIdx++;
        loadQuestion();
      } else {
        // Show End Screen & CTA
        document.getElementById('quiz-container').classList.add('hidden');
        document.getElementById('quiz-footer').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        // Reset local storage on completion
        localStorage.setItem('caAuditAppProgress', 0);
      }
    }

    function prevQuestion() {
      closeModal();
      if (currentIdx > 0) {
        currentIdx--;
        loadQuestion();
      }
    }

    // Retake / Reset Quiz Function
    function retakeQuiz() {
      if(confirm("Are you sure you want to restart the quiz from Question 1?")) {
        currentIdx = 0;
        localStorage.setItem('caAuditAppProgress', 0);
        initGame();
      }
    }

    // Lifeline Functions
    function use5050() {
      if (isAnswered) return;
      const q = questionsData[currentIdx];
      const wrongIndices = [0, 1, 2, 3].filter(i => i !== q.correctOption);
      
      wrongIndices.sort(() => Math.random() - 0.5);
      if (document.getElementById(`opt-${wrongIndices[0]}`)) {
        document.getElementById(`opt-${wrongIndices[0]}`).style.visibility = 'hidden';
      }
      if (document.getElementById(`opt-${wrongIndices[1]}`)) {
        document.getElementById(`opt-${wrongIndices[1]}`).style.visibility = 'hidden';
      }

      const btn = document.getElementById('life-5050');
      btn.disabled = true;
      btn.classList.add('opacity-30', 'cursor-not-allowed');
    }

    function useAudiencePoll() {
      if (isAnswered) return;
      const q = questionsData[currentIdx];
      const optChar = ['A', 'B', 'C', 'D'][q.correctOption];
      alert(`📊 Audience Poll Results:\nOption ${optChar} is leading with a massive majority!`);
      const btn = document.getElementById('life-poll');
      btn.disabled = true;
      btn.classList.add('opacity-30', 'cursor-not-allowed');
    }

    function useExpertAdvice() {
      if (isAnswered) return;
      const q = questionsData[currentIdx];
      const optChar = ['A', 'B', 'C', 'D'][q.correctOption];
      alert(`👨‍🏫 Satyam's Advice:\n"Based on the ICAI Standards on Auditing, I strongly suggest going with Option (${optChar})."`);
      const btn = document.getElementById('life-expert');
      btn.disabled = true;
      btn.classList.add('opacity-30', 'cursor-not-allowed');
    }

    // Load dynamic data on startup
    window.onload = fetchQuestions;
  </script>
</body>
</html>
