<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CA Final Audit - Pro Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap');

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-light: #dbeafe;
            --correct: #059669;
            --correct-bg: #d1fae5;
            --wrong: #dc2626;
            --wrong-bg: #fee2e2;
            --marked: #f59e0b;
            --marked-bg: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
        }

        .poppins {
            font-family: 'Poppins', sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 8px 8px 0;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--primary-light);
            border: 1px solid #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .header-title h2 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .header-title p {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            color: #475569;
            transition: all 0.15s;
        }

        .btn-icon:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }

        .btn-icon.lifeline {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: var(--primary);
        }

        .btn-icon.retake {
            background: #fef2f2;
            border-color: #fecaca;
            color: #ef4444;
        }

        /* Lifeline Dropdown */
        .lifeline-dropdown {
            display: none;
            position: fixed;
            top: 60px;
            right: 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            min-width: 140px;
        }

        .lifeline-dropdown button {
            display: block;
            width: 100%;
            padding: 10px 14px;
            border: none;
            background: none;
            font-size: 0.78rem;
            cursor: pointer;
            text-align: left;
            border-radius: 8px;
            font-weight: 500;
            color: #334155;
        }

        .lifeline-dropdown button:active {
            background: #f1f5f9;
        }

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 6px 8px;
            background: var(--surface);
            border-radius: 25px;
            padding: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: 25px;
            background: transparent;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .mark-bookmark {
            width: 34px;
            height: 34px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Main Scroll Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 8px 8px 4px;
            min-height: 0;
        }

        /* Question Card */
        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .case-study-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            line-height: 1.55;
            max-height: 25vh;
            overflow-y: auto;
            color: #475569;
        }

        .case-study-box .case-label {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .question-text {
            font-size: 0.88rem;
            line-height: 1.55;
            color: var(--text);
        }

        .question-text .q-number {
            color: var(--primary);
            font-weight: 700;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.84rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            line-height: 1.4;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.78rem;
            flex-shrink: 0;
            color: #475569;
        }

        .option-btn.correct {
            border-color: var(--correct) !important;
            background: var(--correct-bg) !important;
        }

        .option-btn.correct .option-letter {
            background: #a7f3d0;
            border-color: var(--correct);
            color: var(--correct);
        }

        .option-btn.wrong {
            border-color: var(--wrong) !important;
            background: var(--wrong-bg) !important;
        }

        .option-btn.wrong .option-letter {
            background: #fecaca;
            border-color: var(--wrong);
            color: var(--wrong);
        }

        .option-btn.selected {
            border-color: var(--marked) !important;
            background: var(--marked-bg) !important;
        }

        .option-btn.selected .option-letter {
            background: #fde68a;
            border-color: var(--marked);
            color: #92400e;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        /* Question Dots */
        .dots-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .dots-container::-webkit-scrollbar {
            display: none;
        }

        .dot-btn {
            min-width: 40px;
            width: 40px;
            height: 40px;
            border-radius: 9px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            color: #475569;
            transition: all 0.15s;
        }

        .dot-btn:active {
            transform: scale(0.93);
        }

        .dot-btn.current {
            border-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .dot-btn.answered {
            background: #dbeafe;
            border-color: var(--primary);
            color: #1e40af;
        }

        .dot-btn.incorrect {
            background: #fee2e2;
            border-color: var(--wrong);
            color: #991b1b;
        }

        .mark-indicator {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 10px;
            height: 10px;
            background: var(--marked);
            border-radius: 50%;
            border: 2px solid white;
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            padding: 8px 10px;
            margin: 0 8px 8px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            color: #475569;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .nav-btn:active {
            background: #e2e8f0;
            transform: scale(0.94);
        }

        .nav-btn.next-btn {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .score-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            background: #eff6ff;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            white-space: nowrap;
        }

        /* Overlays */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .modal-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 0.82rem;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .modal-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal-card button:active {
            background: #2563eb;
        }

        /* Bottom Sheet */
        .bottom-sheet {
            position: fixed;
            inset: 0;
            top: auto;
            background: white;
            border-radius: 22px 22px 0 0;
            max-height: 75vh;
            overflow-y: auto;
            z-index: 160;
            padding: 18px;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.12);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            position: sticky;
            top: 0;
            background: white;
            padding-bottom: 10px;
            z-index: 1;
        }

        .sheet-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .close-sheet-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        .close-sheet-btn:active {
            background: #e2e8f0;
        }

        .review-item {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .review-item:active {
            background: #f8fafc;
        }

        .review-item h4 {
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .review-item p {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 30px 16px;
        }

        .end-screen .trophy {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        .end-screen h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .end-screen p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .end-screen .subscribe-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #ef4444;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 10px;
        }

        .end-screen .retake-btn {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: white;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.72rem;
            font-weight: 600;
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .tab-btn {
                font-size: 0.7rem;
                padding: 7px 6px;
            }

            .option-btn {
                font-size: 0.8rem;
                padding: 10px 12px;
            }

            .dot-btn {
                min-width: 36px;
                width: 36px;
                height: 36px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div id="toast" class="toast">❤️ Like this app? Subscribe to Satyam's YouTube!</div>

    <!-- APP CONTAINER -->
    <div class="app-container">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">CA</div>
                <div class="header-title">
                    <h2 class="poppins">FINAL AUDIT</h2>
                    <p>Pro Simulator</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon lifeline" id="lifelineBtn" onclick="toggleLifelineMenu()" title="Lifelines">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
                <button class="btn-icon retake" onclick="handleRetake()" title="Retake Quiz">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- LIFELINE DROPDOWN -->
        <div id="lifelineDropdown" class="lifeline-dropdown">
            <button onclick="useFiftyFifty()">🎯 50:50</button>
            <button onclick="useAudiencePoll()">📊 Audience Poll</button>
            <button onclick="useExpertAdvice()">👔 Expert Advice</button>
        </div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
            <button id="tabStudy" class="tab-btn active" onclick="switchMode('study')">
                <i class="fa-solid fa-book-open"></i> Direct MCQs
            </button>
            <button id="tabCases" class="tab-btn" onclick="switchMode('mcqs')">
                <i class="fa-solid fa-briefcase"></i> Case Studies
            </button>
            <button class="mark-bookmark" id="bookmarkBtn" onclick="toggleBookmark()" title="Mark for review">
                <i class="fa-regular fa-bookmark" id="bookmarkIcon"></i>
            </button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content" id="mainContent">
            <!-- Quiz Area -->
            <div id="quizArea">
                <div class="question-card">
                    <div id="questionDisplay"></div>
                </div>
                <div class="options-list" id="optionsDisplay"></div>
                <div class="dots-container" id="dotsDisplay"></div>
            </div>

            <!-- End Screen -->
            <div id="endScreen" class="end-screen" style="display: none;">
                <div class="trophy">🏆</div>
                <h2 class="poppins">Quiz Completed!</h2>
                <p>You've attempted all questions in this mode.</p>
                <a href="https://youtube.com/@observe_with_satyam?si=9BiGcrs2Dhv4HDFa" target="_blank" class="subscribe-btn">
                    <i class="fab fa-youtube"></i> Subscribe on YouTube
                </a>
                <br>
                <button class="retake-btn" onclick="handleRetake()">
                    <i class="fa-solid fa-rotate-right"></i> Retake Quiz
                </button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <button class="nav-btn" onclick="goToPrevious()" title="Previous">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="nav-btn" onclick="openPaletteSheet()" title="Question Palette">
                <i class="fa-solid fa-table-cells"></i>
            </button>
            <div class="score-badge" id="scoreDisplay">1/10</div>
            <button class="nav-btn" onclick="openReviewSheet()" title="Review All">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button class="nav-btn next-btn" onclick="goToNext()" title="Next">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- EXPLANATION MODAL -->
    <div id="explanationModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="explanationTitle"></h3>
            <p id="explanationBody"></p>
            <button id="explanationNextBtn" onclick="goToNext()">Next Question</button>
        </div>
    </div>

    <!-- PALETTE SHEET -->
    <div id="paletteSheet" class="bottom-sheet" style="display: none;">
        <div class="sheet-header">
            <h3>Question Palette</h3>
            <button class="close-sheet-btn" onclick="closePaletteSheet()">&times;</button>
        </div>
        <div id="paletteGrid" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;"></div>
        <div style="display: flex; gap: 12px; margin-top: 14px; font-size: 0.72rem; color: #64748b; flex-wrap: wrap;">
            <span>🔵 Answered</span>
            <span>🔴 Wrong</span>
            <span>🟡 Marked</span>
            <span>⚪ Unanswered</span>
        </div>
    </div>

    <!-- REVIEW SHEET -->
    <div id="reviewSheet" class="bottom-sheet" style="display: none; top: 0; max-height: 100vh;">
        <div class="sheet-header">
            <h3>Review All Questions</h3>
            <button class="close-sheet-btn" onclick="closeReviewSheet()">&times;</button>
        </div>
        <div id="reviewList"></div>
    </div>

    <script>
        // =============================================
        // GLOBAL STATE - All in one object
        // =============================================
        const AppState = {
            mode: 'study', // 'study' or 'mcqs'
            questions: [],
            currentIndex: 0,
            session: [], // { selected: null|number, isCorrect: null|boolean, marked: boolean }
            isAnswered: false,
            selectedOption: null,
            toastShown: false,
            audioContext: null
        };

        // =============================================
        // AUDIO FUNCTIONS
        // =============================================
        function getAudioContext() {
            if (!AppState.audioContext) {
                AppState.audioContext = new(window.AudioContext || window.webkitAudioContext)();
            }
            if (AppState.audioContext.state === 'suspended') {
                AppState.audioContext.resume();
            }
            return AppState.audioContext;
        }

        function playBeep(frequency, type, duration) {
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.type = type || 'sine';
                oscillator.frequency.value = frequency || 440;
                gainNode.gain.setValueAtTime(0.06, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration || 0.12));
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.start();
                oscillator.stop(ctx.currentTime + (duration || 0.12));
            } catch (e) {
                // Silently fail if audio not supported
            }
        }

        function playCorrectSound() {
            playBeep(523, 'triangle', 0.15);
            setTimeout(function() { playBeep(659, 'triangle', 0.15); }, 120);
            setTimeout(function() { playBeep(784, 'triangle', 0.2); }, 240);
        }

        function playWrongSound() {
            playBeep(220, 'sawtooth', 0.2);
            setTimeout(function() { playBeep(180, 'sawtooth', 0.25); }, 200);
        }

        // =============================================
        // UTILITY FUNCTIONS
        // =============================================
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizeQuestionData(data) {
            const records = Array.isArray(data) ? data : (data.caseScenarios || data.questions || []);
            return records.flatMap(function(record, recordIndex) {
                // Case scenario with nested questions
                if (record.questions && Array.isArray(record.questions)) {
                    return record.questions.map(function(question, questionIndex) {
                        return {
                            question: question.question || 'Question ' + (questionIndex + 1),
                            options: question.options || [],
                            correctOption: parseInt(question.correctOption) || 0,
                            explanation: question.explanation || '',
                            caseStudy: record.caseStudy || record.scenario || '',
                            scenarioNumber: record.scenarioNumber || (recordIndex + 1),
                            questionNumber: question.questionNumber || (record.scenarioNumber || (recordIndex +
                                1)) + '.' + (questionIndex + 1)
                        };
                    });
                }
                // Standalone question
                return [{
                    question: record.question || 'Question ' + (recordIndex + 1),
                    options: record.options || [],
                    correctOption: parseInt(record.correctOption) || 0,
                    explanation: record.explanation || '',
                    caseStudy: record.caseStudy || '',
                    scenarioNumber: record.scenarioNumber || (recordIndex + 1),
                    questionNumber: record.questionNumber || 'Q' + (recordIndex + 1)
                }];
            }).filter(function(q) {
                return q.options.length > 0;
            });
        }

        // =============================================
        // DATA LOADING
        // =============================================
        async function loadQuestions() {
            var files = AppState.mode === 'mcqs' ?
                ['./audit_case_scenarios.json'] :
                ['./study.json', './mcqs.json'];

            try {
                var responses = await Promise.all(files.map(function(file) {
                    return fetch(file).then(function(response) {
                        if (!response.ok) {
                            throw new Error('Failed to load ' + file);
                        }
                        return response.json();
                    });
                }));

                AppState.questions = AppState.mode === 'mcqs' ?
                    normalizeQuestionData(responses[0]) :
                    responses.flatMap(normalizeQuestionData);

                if (AppState.questions.length === 0) {
                    document.getElementById('questionDisplay').innerHTML =
                        '<p style="color:#ef4444;">No questions found. Please check JSON files.</p>';
                    document.getElementById('optionsDisplay').innerHTML = '';
                    document.getElementById('dotsDisplay').innerHTML = '';
                    return;
                }

                // Initialize or fix session
                if (AppState.session.length !== AppState.questions.length) {
                    var newSession = [];
                    for (var i = 0; i < AppState.questions.length; i++) {
                        if (i < AppState.session.length && AppState.session[i]) {
                            newSession.push(AppState.session[i]);
                        } else {
                            newSession.push({ selected: null, isCorrect: null, marked: false });
                        }
                    }
                    AppState.session = newSession;
                }

                if (AppState.currentIndex >= AppState.questions.length) {
                    AppState.currentIndex = 0;
                }

                renderCurrentQuestion();
                saveProgress();
            } catch (error) {
                console.error('Error loading questions:', error);
                document.getElementById('questionDisplay').innerHTML =
                    '<p style="color:#ef4444;">Error loading questions. Make sure JSON files are in the same folder.</p>';
                document.getElementById('optionsDisplay').innerHTML = '';
                document.getElementById('dotsDisplay').innerHTML = '';
            }
        }

        // =============================================
        // RENDERING
        // =============================================
        function renderCurrentQuestion() {
            var question = AppState.questions[AppState.currentIndex];
            if (!question) return;

            // Reset state for new question
            AppState.isAnswered = false;
            AppState.selectedOption = null;

            var sessionState = AppState.session[AppState.currentIndex] || { selected: null, isCorrect: null,
                marked: false };

            // Build question HTML
            var questionHTML = '';

            if (question.caseStudy) {
                questionHTML += '<div class="case-study-box">';
                questionHTML += '<div class="case-label">📋 CASE SCENARIO ' + escapeHtml(String(question
                    .scenarioNumber)) + '</div>';
                questionHTML += escapeHtml(question.caseStudy);
                questionHTML += '</div>';
            }

            questionHTML += '<div class="question-text">';
            questionHTML += '<span class="q-number">' + escapeHtml(String(question.questionNumber)) +
                '.</span> ';
            questionHTML += escapeHtml(question.question);
            questionHTML += '</div>';

            document.getElementById('questionDisplay').innerHTML = questionHTML;

            // Build options
            var optionsHTML = '';
            for (var i = 0; i < question.options.length; i++) {
                var optClass = 'option-btn';
                var disabled = '';

                if (sessionState.selected !== null) {
                    disabled = 'disabled';
                    if (i === sessionState.selected && !sessionState.isCorrect) {
                        optClass += ' wrong';
                    }
                    if (i === question.correctOption) {
                        optClass += ' correct';
                    }
                    AppState.isAnswered = true;
                }

                optionsHTML += '<button class="' + optClass + '" ' + disabled +
                    ' onclick="handleOptionClick(' + i + ')" id="optBtn' + i + '">';
                optionsHTML += '<span class="option-letter">' + String.fromCharCode(65 + i) + '</span>';
                optionsHTML += '<span>' + escapeHtml(question.options[i]) + '</span>';
                optionsHTML += '</button>';
            }

            document.getElementById('optionsDisplay').innerHTML = optionsHTML;

            // Build dots
            renderDots();

            // Update score badge
            document.getElementById('scoreDisplay').textContent = (AppState.currentIndex + 1) + '/' + AppState
                .questions.length;

            // Update bookmark icon
            updateBookmarkIcon();

            // Scroll to top
            document.getElementById('mainContent').scrollTop = 0;
        }

        function renderDots() {
            var dotsHTML = '';
            for (var i = 0; i < AppState.questions.length; i++) {
                var state = AppState.session[i] || { selected: null, isCorrect: null, marked: false };
                var dotClass = 'dot-btn';

                if (i === AppState.currentIndex) {
                    dotClass += ' current';
                }
                if (state.selected !== null) {
                    dotClass += state.isCorrect ? ' answered' : ' incorrect';
                }

                dotsHTML += '<button class="' + dotClass + '" onclick="jumpToQuestion(' + i + ')">';
                dotsHTML += (i + 1);
                if (state.marked) {
                    dotsHTML += '<span class="mark-indicator"></span>';
                }
                dotsHTML += '</button>';
            }
            document.getElementById('dotsDisplay').innerHTML = dotsHTML;

            // Auto-scroll to current dot
            setTimeout(function() {
                var dotsContainer = document.getElementById('dotsDisplay');
                var currentDot = dotsContainer.querySelector('.dot-btn.current');
                if (currentDot) {
                    currentDot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 100);
        }

        function updateBookmarkIcon() {
            var state = AppState.session[AppState.currentIndex] || { marked: false };
            var icon = document.getElementById('bookmarkIcon');
            if (state.marked) {
                icon.className = 'fa-solid fa-bookmark';
                icon.style.color = '#f59e0b';
            } else {
                icon.className = 'fa-regular fa-bookmark';
                icon.style.color = '';
            }
        }

        // =============================================
        // USER ACTIONS
        // =============================================
        function handleOptionClick(optionIndex) {
            if (AppState.isAnswered) return;

            // Play click sound
            playBeep(400, 'sine', 0.06);

            // Remove any previous selection styling
            var allButtons = document.querySelectorAll('#optionsDisplay .option-btn');
            for (var i = 0; i < allButtons.length; i++) {
                allButtons[i].classList.remove('selected');
            }

            // Add selection styling
            var selectedButton = document.getElementById('optBtn' + optionIndex);
            if (selectedButton) {
                selectedButton.classList.add('selected');
            }

            AppState.selectedOption = optionIndex;

            // Lock answer after short delay
            setTimeout(function() {
                lockAnswer(optionIndex);
            }, 400);
        }

        function lockAnswer(optionIndex) {
            if (AppState.isAnswered) return;
            AppState.isAnswered = true;

            var question = AppState.questions[AppState.currentIndex];
            var isCorrect = (optionIndex === question.correctOption);

            // Update session
            AppState.session[AppState.currentIndex] = {
                selected: optionIndex,
                isCorrect: isCorrect,
                marked: AppState.session[AppState.currentIndex] ? AppState.session[AppState.currentIndex].marked :
                    false
            };

            // Update button styles
            var allButtons = document.querySelectorAll('#optionsDisplay .option-btn');
            for (var i = 0; i < allButtons.length; i++) {
                allButtons[i].disabled = true;
                allButtons[i].classList.remove('selected');
            }

            var selectedButton = document.getElementById('optBtn' + optionIndex);
            var correctButton = document.getElementById('optBtn' + question.correctOption);

            if (isCorrect) {
                if (selectedButton) selectedButton.classList.add('correct');
                playCorrectSound();
            } else {
                if (selectedButton) selectedButton.classList.add('wrong');
                if (correctButton && correctButton !== selectedButton) correctButton.classList.add('correct');
                playWrongSound();
            }

            // Update dots
            renderDots();
            saveProgress();

            // Show explanation after delay
            setTimeout(function() {
                showExplanation(isCorrect);
            }, 700);
        }

        function showExplanation(isCorrect) {
            var question = AppState.questions[AppState.currentIndex];

            document.getElementById('explanationTitle').innerHTML = isCorrect ?
                '✅ Correct!' :
                '❌ Incorrect';

            var bodyHTML = '';
            if (isCorrect) {
                bodyHTML = 'Great job! You selected the right answer.';
            } else {
                bodyHTML = 'The correct answer is:<br><b>' + escapeHtml(question.options[question.correctOption]) +
                    '</b>';
            }
            if (question.explanation) {
                bodyHTML += '<br><br><small style="color:#64748b;">' + escapeHtml(question.explanation) +
                '</small>';
            }

            document.getElementById('explanationBody').innerHTML = bodyHTML;

            var nextBtn = document.getElementById('explanationNextBtn');
            if (AppState.currentIndex >= AppState.questions.length - 1) {
                nextBtn.textContent = 'Finish Quiz';
            } else {
                nextBtn.textContent = 'Next Question →';
            }

            document.getElementById('explanationModal').style.display = 'flex';
        }

        function goToNext() {
            // Hide explanation modal if open
            document.getElementById('explanationModal').style.display = 'none';

            if (AppState.currentIndex < AppState.questions.length - 1) {
                AppState.currentIndex++;
                renderCurrentQuestion();
                saveProgress();
                checkToast();
            } else {
                finishQuiz();
            }
        }

        function goToPrevious() {
            // Hide explanation modal if open
            document.getElementById('explanationModal').style.display = 'none';

            if (AppState.currentIndex > 0) {
                AppState.currentIndex--;
                renderCurrentQuestion();
                saveProgress();
            }
        }

        function jumpToQuestion(index) {
            // Hide explanation modal if open
            document.getElementById('explanationModal').style.display = 'none';

            if (index >= 0 && index < AppState.questions.length) {
                AppState.currentIndex = index;
                renderCurrentQuestion();
                saveProgress();
            }
        }

        function toggleBookmark() {
            var state = AppState.session[AppState.currentIndex] || { selected: null, isCorrect: null, marked: false };
            state.marked = !state.marked;
            AppState.session[AppState.currentIndex] = state;
            updateBookmarkIcon();
            renderDots();
            saveProgress();
        }

        function finishQuiz() {
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            // Clear progress
            localStorage.removeItem('caAuditPro_mode');
            localStorage.removeItem('caAuditPro_progress');
        }

        function handleRetake() {
            if (confirm('Are you sure you want to restart the quiz from the beginning?')) {
                AppState.session = [];
                AppState.currentIndex = 0;
                AppState.isAnswered = false;
                AppState.selectedOption = null;
                document.getElementById('quizArea').style.display = 'block';
                document.getElementById('endScreen').style.display = 'none';
                document.getElementById('explanationModal').style.display = 'none';
                loadQuestions();
            }
        }

        // =============================================
        // LIFELINES
        // =============================================
        function toggleLifelineMenu() {
            var dropdown = document.getElementById('lifelineDropdown');
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                dropdown.style.display = 'block';
            }
        }

        function useFiftyFifty() {
            toggleLifelineMenu();
            if (AppState.isAnswered) return;

            var question = AppState.questions[AppState.currentIndex];
            var wrongIndices = [];
            for (var i = 0; i < question.options.length; i++) {
                if (i !== question.correctOption) {
                    wrongIndices.push(i);
                }
            }

            // Shuffle and pick 2 to hide
            wrongIndices.sort(function() { return Math.random() - 0.5; });
            var toHide = wrongIndices.slice(0, Math.min(2, wrongIndices.length));

            for (var j = 0; j < toHide.length; j++) {
                var btn = document.getElementById('optBtn' + toHide[j]);
                if (btn) {
                    btn.style.opacity = '0.25';
                    btn.disabled = true;
                }
            }
        }

        function useAudiencePoll() {
            toggleLifelineMenu();
            if (AppState.isAnswered) return;
            var question = AppState.questions[AppState.currentIndex];
            alert('📊 Audience Poll Results:\n\nOption ' + String.fromCharCode(65 + question.correctOption) +
                ' is leading with a huge majority!');
        }

        function useExpertAdvice() {
            toggleLifelineMenu();
            if (AppState.isAnswered) return;
            var question = AppState.questions[AppState.currentIndex];
            alert('👔 Expert Advice:\n\n"Based on auditing standards, I recommend going with Option ' +
                String.fromCharCode(65 + question.correctOption) + '."');
        }

        // =============================================
        // PALETTE SHEET
        // =============================================
        function openPaletteSheet() {
            var grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';

            for (var i = 0; i < AppState.questions.length; i++) {
                var state = AppState.session[i] || { selected: null, isCorrect: null, marked: false };
                var dotClass = 'dot-btn';
                if (i === AppState.currentIndex) dotClass += ' current';
                if (state.selected !== null) dotClass += state.isCorrect ? ' answered' : ' incorrect';

                var btnHTML = '<button class="' + dotClass +
                    '" style="width:100%;aspect-ratio:1;" onclick="jumpToQuestion(' + i +
                    ');closePaletteSheet();">';
                btnHTML += (i + 1);
                if (state.marked) {
                    btnHTML += '<span class="mark-indicator"></span>';
                }
                btnHTML += '</button>';

                grid.innerHTML += btnHTML;
            }

            document.getElementById('paletteSheet').style.display = 'block';
        }

        function closePaletteSheet() {
            document.getElementById('paletteSheet').style.display = 'none';
        }

        // =============================================
        // REVIEW SHEET
        // =============================================
        function openReviewSheet() {
            var list = document.getElementById('reviewList');
            list.innerHTML = '';

            for (var i = 0; i < AppState.questions.length; i++) {
                var question = AppState.questions[i];
                var state = AppState.session[i] || { selected: null, isCorrect: null, marked: false };

                var statusIcon = '⚪';
                var statusText = 'Not answered';
                if (state.selected !== null) {
                    if (state.isCorrect) {
                        statusIcon = '✅';
                        statusText = 'Correct';
                    } else {
                        statusIcon = '❌';
                        statusText = 'Wrong';
                    }
                }

                var itemHTML = '<div class="review-item" onclick="jumpToQuestion(' + i +
                    ');closeReviewSheet();">';
                itemHTML += '<div style="display:flex;align-items:flex-start;gap:10px;">';
                itemHTML += '<span style="font-size:1.2rem;flex-shrink:0;">' + statusIcon + '</span>';
                itemHTML += '<div style="flex:1;">';
                itemHTML += '<h4>Q' + (i + 1) + ': ' + escapeHtml(question.question.substring(0, 100));
                if (question.question.length > 100) itemHTML += '...';
                itemHTML += '</h4>';
                itemHTML += '<p>Status: ' + statusText;
                if (state.selected !== null) {
                    itemHTML += ' | Correct: ' + escapeHtml(question.options[question.correctOption]);
                }
                if (state.marked) {
                    itemHTML += ' | 🔖 Marked for review';
                }
                itemHTML += '</p>';
                itemHTML += '</div>';
                itemHTML += '</div>';
                itemHTML += '</div>';

                list.innerHTML += itemHTML;
            }

            document.getElementById('reviewSheet').style.display = 'block';
        }

        function closeReviewSheet() {
            document.getElementById('reviewSheet').style.display = 'none';
        }

        // =============================================
        // MODE SWITCHING
        // =============================================
        function switchMode(mode) {
            if (AppState.mode === mode) return;

            AppState.mode = mode;
            AppState.session = [];
            AppState.currentIndex = 0;
            AppState.isAnswered = false;
            AppState.selectedOption = null;

            // Update tab buttons
            document.getElementById('tabStudy').classList.toggle('active', mode === 'study');
            document.getElementById('tabCases').classList.toggle('active', mode === 'mcqs');

            // Show quiz area
            document.getElementById('quizArea').style.display = 'block';
            document.getElementById('endScreen').style.display = 'none';
            document.getElementById('explanationModal').style.display = 'none';

            // Save mode preference
            localStorage.setItem('caAuditPro_mode', mode);

            loadQuestions();
        }

        // =============================================
        // PERSISTENCE
        // =============================================
        function saveProgress() {
            try {
                localStorage.setItem('caAuditPro_mode', AppState.mode);
                localStorage.setItem('caAuditPro_progress', JSON.stringify({
                    mode: AppState.mode,
                    index: AppState.currentIndex,
                    session: AppState.session
                }));
            } catch (e) {
                // Storage might be full or unavailable
            }
        }

        function loadProgress() {
            try {
                var savedMode = localStorage.getItem('caAuditPro_mode');
                if (savedMode && (savedMode === 'study' || savedMode === 'mcqs')) {
                    AppState.mode = savedMode;
                }

                var savedProgress = localStorage.getItem('caAuditPro_progress');
                if (savedProgress) {
                    var data = JSON.parse(savedProgress);
                    if (data.mode === AppState.mode) {
                        AppState.currentIndex = data.index || 0;
                        AppState.session = data.session || [];
                    }
                }

                // Update tab buttons
                document.getElementById('tabStudy').classList.toggle('active', AppState.mode === 'study');
                document.getElementById('tabCases').classList.toggle('active', AppState.mode === 'mcqs');
            } catch (e) {
                // Ignore parsing errors
            }
        }

        function checkToast() {
            if (AppState.toastShown) return;

            var attemptedCount = 0;
            for (var i = 0; i < AppState.session.length; i++) {
                if (AppState.session[i] && AppState.session[i].selected !== null) {
                    attemptedCount++;
                }
            }

            if (attemptedCount >= 20) {
                var toast = document.getElementById('toast');
                toast.classList.add('show');
                AppState.toastShown = true;
                setTimeout(function() {
                    toast.classList.remove('show');
                }, 5000);
            }
        }

        // =============================================
        // EVENT LISTENERS
        // =============================================
        // Close lifeline dropdown when clicking outside
        document.addEventListener('click', function(event) {
            var dropdown = document.getElementById('lifelineDropdown');
            var lifelineBtn = document.getElementById('lifelineBtn');

            if (dropdown.style.display === 'block') {
                if (!dropdown.contains(event.target) && event.target !== lifelineBtn && !lifelineBtn.contains(
                        event.target)) {
                    dropdown.style.display = 'none';
                }
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight') {
                event.preventDefault();
                goToNext();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                goToPrevious();
            } else if (event.key === 'Escape') {
                document.getElementById('explanationModal').style.display = 'none';
                document.getElementById('paletteSheet').style.display = 'none';
                document.getElementById('reviewSheet').style.display = 'none';
                document.getElementById('lifelineDropdown').style.display = 'none';
            }
        });

        // Close sheets when clicking overlay background
        document.getElementById('paletteSheet').addEventListener('click', function(event) {
            if (event.target === this) {
                closePaletteSheet();
            }
        });

        document.getElementById('reviewSheet').addEventListener('click', function(event) {
            if (event.target === this) {
                closeReviewSheet();
            }
        });

        document.getElementById('explanationModal').addEventListener('click', function(event) {
            if (event.target === this) {
                // Don't close - user must click Next button
            }
        });

        // =============================================
        // INITIALIZATION
        // =============================================
        window.addEventListener('load', function() {
            loadProgress();
            loadQuestions();

            // Ensure quiz area is visible
            document.getElementById('quizArea').style.display = 'block';
            document.getElementById('endScreen').style.display = 'none';
        });

        // Log to confirm script loaded
        console.log('✅ CA Final Audit Pro Simulator - Script Loaded Successfully');
        console.log('📱 All buttons are functional:');
        console.log('  - ◀ Previous: goToPrevious()');
        console.log('  - ▶ Next: goToNext()');
        console.log('  - ⊞ Palette: openPaletteSheet() / closePaletteSheet()');
        console.log('  - 📋 Review: openReviewSheet() / closeReviewSheet()');
        console.log('  - 🔖 Bookmark: toggleBookmark()');
        console.log('  - ✨ Lifelines: toggleLifelineMenu()');
        console.log('  - 🔄 Retake: handleRetake()');
        console.log('  - 📖/💼 Mode tabs: switchMode()');
    </script>
</body>
  </html>
